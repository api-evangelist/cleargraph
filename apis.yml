description: Cleargraph was a Palo Alto, California startup building natural-language and graph-based
  search over data, operating under the tagline "Data Accessible through Search." It was backed by
  Version One Ventures and appears in the API Evangelist network as a portfolio lead. As of this
  enrichment pass the company is inactive - its primary domain cleargraph.com now 301-redirects
  off-site, its cleargraph.io website no longer resolves (connection refused), and its GitHub
  organization (github.com/cleargraph) was archived in April 2026 and holds only forked libraries
  with no first-party API, SDK, or specification. No live API, developer portal, documentation, or
  first-party package surface could be verified during enrichment, so no API artifacts were generated.
